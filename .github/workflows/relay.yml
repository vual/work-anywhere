name: relay

on:
  push:
    paths:
      - "relay/**"
      - "desktop/internal/remote/**"
      - "desktop/go.mod"
      - "desktop/go.sum"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "relay/**"
      - "desktop/internal/remote/**"
      - "desktop/go.mod"
      - "desktop/go.sum"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/relay.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: enrollment_test
          POSTGRES_USER: enrollment_test
          POSTGRES_PASSWORD: enrollment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enrollment_test -d enrollment_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      RELAY_TEST_DATABASE_URL: postgres://enrollment_test:enrollment_test@localhost:5432/enrollment_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            relay/go.sum
            desktop/go.sum
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.57.2"
      - name: Verify Relay formatting, tests, and vet
        working-directory: relay
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
      - name: Verify Desktop connector
        working-directory: desktop
        run: |
          test -z "$(gofmt -l internal/remote internal/store internal/daemon internal/cli)"
          go test ./internal/remote/... ./internal/store/... ./internal/cli/...
          go test -run '^$' ./internal/daemon
          go build ./cmd/work-anywhere
          go vet ./...
      - name: Verify protocol generation
        working-directory: relay
        run: |
          buf lint
          buf generate
          buf generate --template buf.gen.desktop.yaml
          git diff --exit-code -- gen ../desktop/internal/remote/gen
      - name: Build production image
        working-directory: relay
        run: docker build --tag work-anywhere-relay:test .
      - name: Verify Compose migrations and enrollment policy
        working-directory: relay
        env:
          RELAY_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ENROLLMENT_MODE: self_service
        run: |
          trap 'docker compose --project-name enrollment-smoke logs; docker compose --project-name enrollment-smoke down --volumes' EXIT
          docker compose --project-name enrollment-smoke up --build --detach
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:18080/health/ready
          docker compose --project-name enrollment-smoke exec --no-TTY relay /relay migrate status
          curl --fail http://127.0.0.1:18080/v1/enrollment/policy | jq -e '.protocol == "daemon-enrollment-v1" and .mode == "self_service"'

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            desktop/go.sum
            relay/go.sum
      - name: Verify Desktop on its supported platform
        working-directory: desktop
        run: |
          go test ./...
          go vet ./...
