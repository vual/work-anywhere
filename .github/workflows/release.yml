name: Release

# Builds Desktop EXE, Windows installer and Android APK, then attaches them to
# the GitHub Release, and pushes the Relay image to GHCR.
# Re-run for an existing release via workflow_dispatch.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  relay-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/work-anywhere-relay
          # latest only moves for non-prerelease semver tags.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}

      - name: Build metadata
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ env.REVISION }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            desktop/go.sum
            relay/go.sum

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }

      - name: Build EXE and installer
        working-directory: desktop
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          .\scripts\build-installer.ps1 -Version $version -Commit (git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      # `self-test` needs the official codex.exe, which the runner does not
      # have; check that the EXE starts and carries the release version.
      - name: Smoke test EXE
        working-directory: desktop
        shell: pwsh
        run: |
          $out = & .\dist\windows-amd64\work-anywhere.exe version
          if ($LASTEXITCODE -ne 0) { throw "version command failed" }
          Write-Host $out
          if ($out -notlike "work-anywhere $env:VERSION (*") { throw "unexpected version output: $out" }

      - name: Upload release assets
        working-directory: desktop/dist/windows-amd64
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "work-anywhere-$env:VERSION-windows-amd64.exe"
          $setup = "work-anywhere-setup-$env:VERSION.exe"
          Copy-Item work-anywhere.exe $exe -Force
          $assets = @($exe, $setup)
          foreach ($f in $assets) {
            $hash = (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $f" | Out-File -FilePath "$f.sha256" -Encoding ascii -NoNewline
            $assets += "$f.sha256"
          }
          gh release upload $env:TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version_code: ${{ steps.apk.outputs.version_code }}
      cert_sha256: ${{ steps.apk.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            relay/go.sum
            mobile/core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Build Android Go Core
        working-directory: mobile/core
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          gomobile init
          mkdir -p ../app/android/app/libs
          gomobile bind -target=android -androidapi 29 -o ../app/android/app/libs/mobilecore.aar ./mobilecore

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WAW_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "WAW_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            # In-app updates compare the APK signer with the installed app, so
            # a debug-signed release would break every later update.
            echo "::error::WAW_ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK."
            exit 1
          fi

      - name: Build release APK
        working-directory: mobile/app
        env:
          WAW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WAW_ANDROID_KEYSTORE_PASSWORD }}
          WAW_ANDROID_KEY_ALIAS: ${{ secrets.WAW_ANDROID_KEY_ALIAS }}
          WAW_ANDROID_KEY_PASSWORD: ${{ secrets.WAW_ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          flutter pub get
          flutter test
          flutter build apk --release --build-name="$VERSION" --build-number="${{ github.run_number }}"

      - name: Inspect APK signer
        id: apk
        working-directory: mobile/app/build/app/outputs/flutter-apk
        shell: bash
        env:
          WAW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WAW_ANDROID_KEYSTORE_PASSWORD }}
          WAW_ANDROID_KEY_ALIAS: ${{ secrets.WAW_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # Release keystore certificate: the identity every in-app update must keep.
          KEY_CERT="$(keytool -exportcert -keystore "$WAW_ANDROID_KEYSTORE" -storepass "$WAW_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$WAW_ANDROID_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          # Cross-check against the certificate actually embedded in the APK.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          OUT="$("$APKSIGNER" verify --print-certs app-release.apk 2>&1)" || { echo "$OUT"; echo "::error::apksigner verify failed"; exit 1; }
          echo "$OUT" | grep -v -i "public key" || true
          CERT="$(echo "$OUT" | grep -m1 -oiE 'certificate SHA-256 digest: [0-9a-f:]+' | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f' || true)"
          if ! echo "$CERT" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::could not read the APK signing certificate digest"
            exit 1
          fi
          if [ "$CERT" != "$KEY_CERT" ]; then
            echo "::error::APK is not signed with the release keystore ($CERT != $KEY_CERT)"
            exit 1
          fi
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        working-directory: mobile/app/build/app/outputs/flutter-apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="work-anywhere-$VERSION-android.apk"
          cp app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release upload "$TAG" "$APK" "$APK.sha256" --clobber --repo "$GITHUB_REPOSITORY"

  # Signs update-manifest.json (desktop/docs/self-update/manifest.md) once all
  # platform assets exist. Any failure leaves the release without a manifest,
  # which clients report as update_manifest_unavailable.
  update-manifest:
    needs: [desktop-windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: desktop/go.sum

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets" \
            --pattern "work-anywhere-setup-$VERSION.exe" \
            --pattern "work-anywhere-$VERSION-windows-amd64.exe" \
            --pattern "work-anywhere-$VERSION-android.apk"
          echo "PUBLISHED_AT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)" >> "$GITHUB_ENV"

      - name: Build and verify manifest
        working-directory: desktop
        env:
          WAW_UPDATE_SIGNING_KEY: ${{ secrets.WAW_UPDATE_SIGNING_KEY }}
          WAW_UPDATE_SIGNING_KEY_ID: ${{ secrets.WAW_UPDATE_SIGNING_KEY_ID }}
        run: |
          A="$RUNNER_TEMP/assets"
          go run ./internal/tools/updatemanifest build \
            -version "$VERSION" \
            -setup "$A/work-anywhere-setup-$VERSION.exe" \
            -portable "$A/work-anywhere-$VERSION-windows-amd64.exe" \
            -apk "$A/work-anywhere-$VERSION-android.apk" \
            -apk-version-code "${{ needs.android.outputs.version_code }}" \
            -apk-cert-sha256 "${{ needs.android.outputs.cert_sha256 }}" \
            -published-at "$PUBLISHED_AT" \
            -out "$RUNNER_TEMP/update-manifest.json"
          # Verifies against the keys compiled into the clients, so a secret
          # that clients do not trust fails here instead of in the field.
          go run ./internal/tools/updatemanifest verify -in "$RUNNER_TEMP/update-manifest.json" -version "$VERSION"

      - name: Upload manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/update-manifest.json" --clobber --repo "$GITHUB_REPOSITORY"
