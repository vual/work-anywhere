services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: work_anywhere
      POSTGRES_USER: work_anywhere
      POSTGRES_PASSWORD: work_anywhere
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work_anywhere -d work_anywhere"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - relay-postgres:/var/lib/postgresql

  migrate:
    build: .
    command: ["migrate", "up"]
    environment: &relay-env
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-http://127.0.0.1:18080}
      DATABASE_URL: postgres://work_anywhere:work_anywhere@postgres:5432/work_anywhere?sslmode=disable
      RELAY_DATA_KEY: ${RELAY_DATA_KEY:?set RELAY_DATA_KEY to standard base64 for 32 bytes}
      ENROLLMENT_MODE: invite
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  relay:
    build: .
    ports:
      - "${RELAY_HOST_BIND_IP:-127.0.0.1}:${RELAY_HOST_PORT:-18080}:8080"
    environment:
      <<: *relay-env
      RELAY_LISTEN_ADDR: :8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  relay-postgres:
